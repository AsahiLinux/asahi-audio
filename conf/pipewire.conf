# Enable all supported native sample rates to avoid resampling
context.properties = {
	default.clock.allowed-rates = [ 44100 48000 88200 96000 176400 192000 ]
	default.clock.rate = 48000
}

# Clamp util to keep Pipewire on ecores
context.modules = [
	{ name = libpipewire-module-rt
        args = {
            nice.level    = -11
            #rt.prio      = 88
            #rt.time.soft = -1
            #rt.time.hard = -1
            uclamp.min = 0
            uclamp.max = 128
        }
        flags = [ ifexists nofail ]
    }
]

# Keep the speaker DSP graph alive across client stream teardown.
#
# When the last client of a filter-chain sink disconnects, the node goes idle
# and PipeWire sends SPA_NODE_COMMAND_Pause (node.pause-on-idle defaults to
# true). module-filter-chain reacts to the resulting PAUSED stream state by
# calling reset_graph(), which deactivates and reactivates every plugin: the
# convolver history and the LSP loud_comp state are lost. Clients that tear
# down and recreate their stream, as Firefox and Chromium do on every seek,
# then get an audible click on the first samples of the new stream.
#
# Disabling idle pause and the session manager suspend timer is not enough in
# practice: without node.always-process the graph is still suspended once the
# target sink goes idle, so keep the graph processing as well. The cost is a
# permanently running DSP (and speaker PCM); measured at well under 1% of one
# core when idle.
node.rules = [
	{
		matches = [
			{ node.name = "~^audio_effect\\..*-convolver$" }
			{ node.name = "~^effect_output\\..*-convolver$" }
		]
		actions = {
			update-props = {
				node.pause-on-idle = false
				node.always-process = true
				session.suspend-timeout-seconds = 0
			}
		}
	}
]
